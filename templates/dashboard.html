
<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <title>RESPdi - Início</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        .animate-fade-in-up { animation: fadeInUp 0.6s ease-out forwards; }
        @keyframes fadeInUp { from { opacity: 0; transform: translateY(20px); } to { opacity: 1; transform: translateY(0); } }
    </style>
</head>
<body class="bg-gray-50 font-sans text-gray-800">
    {% include 'sidebar.html' %}
    
    <div class="pl-28 pt-10 pr-10 max-w-6xl animate-fade-in-up">
        <h1 class="text-4xl font-black text-gray-900 mb-2">Visão Geral</h1>
        <p class="text-gray-500 mb-8">Acompanhe seu desempenho e inicie seus estudos.</p>
        
        <div class="grid grid-cols-1 md:grid-cols-3 gap-6 mb-8">
            <div class="bg-white p-6 rounded-2xl shadow-sm border border-gray-100 hover:shadow-md transition-shadow">
                <p class="text-xs font-bold text-gray-400 uppercase tracking-wider">Total Resolvido</p>
                <p class="text-4xl font-black mt-2 text-gray-800" id="stat-total">0</p>
            </div>
            <div class="bg-white p-6 rounded-2xl shadow-sm border border-green-100 hover:shadow-md transition-shadow">
                <p class="text-xs font-bold text-green-500 uppercase tracking-wider">Acertos</p>
                <p class="text-4xl font-black mt-2 text-green-600" id="stat-acertos">0</p>
            </div>
            <div class="bg-white p-6 rounded-2xl shadow-sm border border-red-100 hover:shadow-md transition-shadow">
                <p class="text-xs font-bold text-red-500 uppercase tracking-wider">Erros</p>
                <p class="text-4xl font-black mt-2 text-red-600" id="stat-erros">0</p>
            </div>
        </div>

        <button onclick="window.location.href='/questoes'" class="bg-blue-600 text-white px-8 py-4 rounded-xl font-bold text-lg hover:bg-blue-700 hover:shadow-lg transition-all duration-300 w-full md:w-auto flex items-center gap-2">
            Iniciar Simulado <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M14 5l7 7m0 0l-7 7m7-7H3"></path></svg>
        </button>

        <!-- Sessão Exclusiva: Painel de Aprovação (Visível apenas para Davi) -->
        <div id="admin-panel" class="hidden mt-12 bg-white p-8 rounded-2xl shadow-lg border-t-4 border-blue-900 animate-fade-in-up">
            <h2 class="text-2xl font-black text-gray-900 mb-2 flex items-center gap-2">
                <svg class="w-6 h-6 text-blue-900" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12l2 2 4-4m5.618-4.016A11.955 11.955 0 0112 2.944a11.955 11.955 0 01-8.618 3.04A12.02 12.02 0 003 9c0 5.591 3.824 10.29 9 11.622 5.176-1.332 9-6.03 9-11.622 0-1.042-.133-2.052-.382-3.016z"></path></svg>
                Painel do Administrador
            </h2>
            <p class="text-sm text-gray-500 mb-6">Aprove ou negue o acesso de novos usuários.</p>
            <div id="lista-pendentes" class="space-y-4">
                <!-- Javascript injeta os cards aqui -->
            </div>
        </div>
    </div>

    <script src="/static/app.js"></script>
    <script>
        document.addEventListener("DOMContentLoaded", () => {
            carregarEstatisticas();
            if (localStorage.getItem('currentUser') === 'davi') {
                document.getElementById('admin-panel').classList.remove('hidden');
                carregarPendentes();
            }
        });
    </script>
</body>
</html>
