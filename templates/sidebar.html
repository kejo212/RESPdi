    <div class="resp-topbar-heading">
        <span class="resp-topbar-eyebrow">RESPdi · Área do estudante</span>

    </div>
    <div class="resp-topbar-right">
        <span class="resp-topbar-status"><span class="resp-status-dot"></span> Seu espaço de preparação</span>
        <a href="/perfil" class="resp-user" style="text-decoration:none" aria-label="Abrir perfil">
            <span id="topbar-username" class="resp-user-name">Estudante</span>
            <span id="topbar-avatar" class="resp-avatar">E</span>
