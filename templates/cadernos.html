<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>RESPdi - Meus Cadernos</title>
    <link rel="icon" type="image/png" href="/static/favicon.png">
    
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="/static/theme.css?v=20261016-1">
    <style>
        .animate-fade-in-up { animation: fadeInUp 0.6s ease-out forwards; } 
        @keyframes fadeInUp { from { opacity: 0; transform: translateY(20px); } to { opacity: 1; transform: translateY(0); } } 
        .hide-temas .tema-dinamico-badge { filter: blur(5px); opacity: 0.5; user-select: none; transition: all 0.3s ease; }
        .hide-temas .tema-dinamico-badge:hover { filter: blur(0); opacity: 1; cursor: pointer; }
    </style>
</head>
<body class="page-notebooks bg-gray-50 font-sans text-gray-800 pb-24 md:pb-10 overflow-x-hidden relative">
    
    {% include 'sidebar.html' %}
    
    <div class="px-4 pt-6 md:pl-32 md:pt-10 md:pr-10 max-w-6xl mx-auto animate-fade-in-up">
        
        <div class="flex flex-col md:flex-row md:items-center justify-between mb-8 gap-4 border-b border-gray-200 pb-4">
            <div>
                <h1 class="text-3xl md:text-4xl font-black text-gray-900 mb-1">Meus Cadernos</h1>
                <p class="text-gray-500 text-sm md:text-base">Listas de exercícios fixas salvas para revisão direcionada.</p>
            </div>
            
            <div class="flex items-center gap-4 w-full md:w-auto">
                <label class="flex items-center cursor-pointer bg-white px-4 py-2 rounded-xl shadow-sm border border-gray-200 w-full md:w-auto justify-between">
                    <span class="text-sm font-bold text-gray-700 mr-3">Modo Anti-Spoiler</span>
                    <div class="relative">
                        <input type="checkbox" id="toggle-temas" class="sr-only" onchange="alternarTemas()">
                        <div class="block bg-gray-300 w-10 h-6 rounded-full transition toggle-label"></div>
                        <div class="dot absolute left-1 top-1 bg-white w-4 h-4 rounded-full transition transform toggle-dot shadow-sm"></div>
                    </div>
                </label>
            </div>
        </div>

        <div id="lista-cadernos" class="grid grid-cols-1 md:grid-cols-3 gap-6 mb-10"></div>

        <div id="caderno-ativo-container" class="hidden">
            <div class="flex items-center justify-between mb-6 w-full">
                <h2 id="titulo-caderno-ativo" class="text-xl md:text-2xl font-black text-blue-900">Resolvendo: Nome</h2>
                <button onclick="fecharCaderno()" class="text-xs md:text-sm bg-gray-200 hover:bg-gray-300 text-gray-800 font-bold py-2 px-4 rounded-xl transition shadow-sm">
                    Voltar à Lista
                </button>
            </div>
            <div id="questoes-container"></div>
        </div>

    </div>
    
    <script src="/static/app.js?v=5001"></script>
    <script>
        document.addEventListener("DOMContentLoaded", () => {
            if(localStorage.getItem('hideTemas') === 'true') {
                document.getElementById('toggle-temas').checked = true;
                document.body.classList.add('hide-temas');
                document.querySelector('.toggle-dot').style.transform = 'translateX(100%)';
            }
        });
    </script>
</body>
</html>
