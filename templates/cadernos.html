<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>RESPdi - Meus Cadernos</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style> .animate-fade-in-up { animation: fadeInUp 0.6s ease-out forwards; } @keyframes fadeInUp { from { opacity: 0; transform: translateY(20px); } to { opacity: 1; transform: translateY(0); } } </style>
</head>
<body class="bg-gray-50 font-sans text-gray-800 pb-24 md:pb-10 overflow-x-hidden">
    
    {% include 'sidebar.html' %}
    
    <div class="px-4 pt-6 md:pl-32 md:pt-10 md:pr-10 max-w-6xl mx-auto animate-fade-in-up">
        
        <div class="mb-8">
            <h1 class="text-3xl md:text-4xl font-black text-gray-900 mb-1">Meus Cadernos</h1>
            <p class="text-gray-500 text-sm md:text-base">Listas de exercícios salvas para revisão direcionada.</p>
        </div>

        <!-- Grade de Cadernos Salvos -->
        <div id="lista-cadernos" class="grid grid-cols-1 md:grid-cols-3 gap-6 mb-10">
            <!-- Renderizado via JS -->
        </div>

        <!-- Área de Resolução do Caderno (Escondida até clicar) -->
        <div id="caderno-ativo-container" class="hidden">
            <div class="flex items-center justify-between mb-6">
                <h2 id="titulo-caderno-ativo" class="text-2xl font-black text-blue-900">Resolvendo: Nome</h2>
                <button onclick="fecharCaderno()" class="text-sm bg-gray-200 hover:bg-gray-300 text-gray-800 font-bold py-2 px-4 rounded-lg transition">Voltar à Lista</button>
            </div>
            
            <div id="questoes-container"></div>
        </div>

    </div>
    
     <script src="/static/app.js?v=4005"></script>
</body>
</html>
