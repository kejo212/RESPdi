<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>RESPdi - Perfil</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        .animate-fade-in-up { animation: fadeInUp 0.6s ease-out forwards; }
        @keyframes fadeInUp { from { opacity: 0; transform: translateY(20px); } to { opacity: 1; transform: translateY(0); } }
    </style>
</head>
<body class="bg-gray-50 font-sans text-gray-800 pb-24 md:pb-10 overflow-x-hidden w-full">
    
    {% include 'sidebar.html' %}
    
    <!-- ESQUELETO RESPONSIVO -->
    <div class="px-4 pt-6 md:pl-32 md:pt-10 md:pr-10 max-w-4xl mx-auto animate-fade-in-up w-full">
        
        <h1 class="text-3xl md:text-4xl font-black text-gray-900 mb-2">Meu Perfil</h1>
        <p class="text-gray-500 mb-8 text-sm md:text-base">Gerencie seus dados e acesse as configurações da conta.</p>

        <div class="bg-white p-6 md:p-10 rounded-3xl shadow-sm border border-gray-100 flex flex-col md:flex-row items-center gap-8 text-center md:text-left w-full">
            <div id="big-avatar" class="w-24 h-24 md:w-32 md:h-32 bg-blue-100 text-blue-600 rounded-full flex items-center justify-center text-4xl md:text-6xl font-black shadow-inner">
                U
            </div>
            <div class="flex-1">
                <h2 id="nome-user" class="text-2xl md:text-3xl font-bold text-gray-900 mb-1">Usuário</h2>
                <p class="text-gray-500 text-sm md:text-base mb-6">Membro da plataforma RESPdi</p>
                
                <button id="logout-btn" class="w-full md:w-auto bg-red-500 hover:bg-red-600 text-white font-bold py-3 px-8 rounded-xl transition-all shadow-sm">
                    Sair do Sistema
                </button>
            </div>
        </div>
    </div>

    <!-- Script rápido e local para o Perfil -->
    <script>
        document.addEventListener("DOMContentLoaded", () => {
            const user = localStorage.getItem('currentUser');
            if(user) {
                document.getElementById('nome-user').innerText = user;
                document.getElementById('big-avatar').innerText = user.charAt(0).toUpperCase();
            }
            if(document.getElementById('sidebar-avatar') && user) {
                document.getElementById('sidebar-avatar').innerText = user.charAt(0).toUpperCase();
            }
        });

        document.getElementById('logout-btn').addEventListener('click', () => {
            if(confirm("Tem certeza que deseja sair?")) {
                localStorage.removeItem('currentUser');
                window.location.href = '/';
            }
        });
    </script>
</body>
</html>
